<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jev-xray</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230f172a%22/%3E%3Crect x=%227%22 y=%2219%22 width=%224%22 height=%226%22 rx=%221%22 fill=%22%23e34948%22/%3E%3Crect x=%2214%22 y=%2213%22 width=%224%22 height=%2212%22 rx=%221%22 fill=%22%23ffffff%22/%3E%3Crect x=%2221%22 y=%227%22 width=%224%22 height=%2218%22 rx=%221%22 fill=%22%232a78d6%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">jev-xray</div>
    <div class="tagline">See how a decision model reaches its answer</div>
    <nav class="scenarios" id="scenarios" aria-label="Scenarios"></nav>
    <div class="model" id="model" title="Model answering every question on this page"><i></i><span>connecting</span></div>
  </header>

  <main class="layout">
    <section class="panel case" aria-label="Case">
      <div class="panel-head">
        <h2>Case</h2>
        <button class="ghost" id="edit-case" type="button">Edit</button>
      </div>
      <div class="doc" id="doc"></div>
      <textarea class="doc-edit" id="doc-edit" spellcheck="false" hidden></textarea>
      <div class="doc-legend" id="doc-legend" hidden></div>
    </section>

    <div class="side">
      <section class="panel decision" aria-label="Decision" aria-live="polite">
        <div class="panel-head">
          <h2 id="question-text"></h2>
          <button class="ghost" id="edit-question" type="button">Edit</button>
        </div>
        <div id="question-editor" hidden></div>
        <div class="verdict" id="verdict"></div>
        <div class="options" id="options"></div>
      </section>

      <section class="panel checks" aria-label="Checks">
        <div class="panel-head">
          <h2>What it checked</h2>
          <span class="tip" tabindex="0" data-tip="Each line is a separate question about the same case. Jev can't explain itself in words, but it can answer the facts its decision depends on.">?</span>
        </div>
        <ul class="check-list" id="checks"></ul>
        <form class="add-check" id="add-check" autocomplete="off">
          <input id="new-check" placeholder="Ask another yes/no question about this case">
        </form>
      </section>

      <section class="panel tools" aria-label="Tools">
        <div class="tabs" role="tablist" id="tool-tabs">
          <button role="tab" data-tool="why" aria-selected="true">Why</button>
          <button role="tab" data-tool="flip">What flips it</button>
          <button role="tab" data-tool="swap">Swap test</button>
        </div>
        <div class="tool" id="tool"></div>
      </section>
    </div>
  </main>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <script src="app.js" type="module"></script>
</body>
</html>
